# Release: a pushed vX.Y.Z tag (make release VERSION=vX.Y.Z, _product/docs/git.md, Releases) becomes a
# GitHub release with generated notes and the Android companion's debug APK, built as ci.yml builds it.
# No tests here: make release only tags a commit whose CI run passed. The build runs with a read-only
# token; only the publish job, which runs no project code, can write. As in ci.yml, GitHub's own actions
# (actions/*) ride their major tag, third-party ones are pinned to a commit, and the build steps use the
# same versions as CI's Android job (tests/release.test.js checks it: bump both files together).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK named after the tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # v5, not v6: v6's cache is a proprietary component under Gradle's terms of use (as in ci.yml).
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Build the debug APK, named after the tag
        working-directory: android
        run: |
          chmod +x gradlew && ./gradlew --no-daemon assembleDebug
          mv app/build/outputs/apk/debug/*.apk "../prudence-${GITHUB_REF_NAME}-android-debug.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: prudence-${{ github.ref_name }}-android-debug.apk
          if-no-files-found: error

  publish:
    name: GitHub release with the APK
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-apk
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Prudence ${{ github.ref_name }}
          body: "Debug build of the Prudence companion app; the web app runs from the repo, see the [README](https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}#readme)."
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: prudence-${{ github.ref_name }}-android-debug.apk
          fail_on_unmatched_files: true
