<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="./prudence-fonts.css"></helmet>
<nav style="display: flex; align-items: stretch; justify-content: space-between; padding: 0 4px; background: #ffffff; border-top: 1px solid #d8dee6; flex: none; font-family: 'Atkinson Hyperlegible Next', Verdana, sans-serif">
  <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 80px; padding: 6px 4px 8px; flex: 1 1 auto; min-width: 0; border: 0; background: none; color: {{ c1 }}; box-shadow: inset 0 4px 0 {{ b1 }}; font-family: inherit; font-size: calc(19px * var(--u, 1)); font-weight: 700; white-space: nowrap; line-height: 1.15; cursor: pointer">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>
    <span>{{ l1 }}</span>
  </button>
  <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 80px; padding: 6px 4px 8px; flex: 1 1 auto; min-width: 0; border: 0; background: none; color: {{ c2 }}; box-shadow: inset 0 4px 0 {{ b2 }}; font-family: inherit; font-size: calc(19px * var(--u, 1)); font-weight: 700; white-space: nowrap; line-height: 1.15; cursor: pointer">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <span>{{ l2 }}</span>
  </button>
  <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 80px; padding: 6px 4px 8px; flex: 1 1 auto; min-width: 0; border: 0; background: none; color: {{ c3 }}; box-shadow: inset 0 4px 0 {{ b3 }}; font-family: inherit; font-size: calc(19px * var(--u, 1)); font-weight: 700; white-space: nowrap; line-height: 1.15; cursor: pointer">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5c3.5 0 6.5.8 9 2.5 2.5-1.7 5.5-2.5 9-2.5v13c-3.5 0-6.5.8-9 2.5-2.5-1.7-5.5-2.5-9-2.5z"></path><path d="M12 7v13"></path></svg>
    <span>{{ l3 }}</span>
  </button>
  <button style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 80px; padding: 6px 4px 8px; flex: 1 1 auto; min-width: 0; border: 0; background: none; color: {{ c4 }}; box-shadow: inset 0 4px 0 {{ b4 }}; font-family: inherit; font-size: calc(19px * var(--u, 1)); font-weight: 700; white-space: nowrap; line-height: 1.15; cursor: pointer">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M5.6 5.6l12.8 12.8"></path></svg>
    <span>{{ l4 }}</span>
  </button>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:80},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;today&quot;,&quot;options&quot;:[&quot;today&quot;,&quot;check&quot;,&quot;learn&quot;,&quot;blocked&quot;,&quot;none&quot;],&quot;tsType&quot;:&quot;'today'|'check'|'learn'|'blocked'|'none'&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;en&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;fr&quot;],&quot;tsType&quot;:&quot;'en'|'fr'&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'today';
    const fr = this.props.lang === 'fr';
    const keys = ['today', 'check', 'learn', 'blocked'];
    const labels = fr ? ["Aujourd'hui", 'Vérifier', 'Leçons', 'Bloqués'] : ['Today', 'Check', 'Learn', 'Blocked'];
    const out = {};
    keys.forEach((k, i) => {
      const on = k === active;
      out['l' + (i + 1)] = labels[i];
      out['c' + (i + 1)] = on ? '#16283f' : '#4a4a4a';
      out['b' + (i + 1)] = on ? '#e9a820' : 'transparent';
    });
    return out;
  }
}
</script>
</body>
</html>
