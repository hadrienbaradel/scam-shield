# Scam Shield in production: the app (built from the Dockerfile here) and Postgres, with
# the data in a bind mount at .infra/prod/_volumes/postgres. Settings come from the
# environment or a .env file next to this file (the Ansible playbook writes it):
#   MASTER_KEY         64 hex characters, the content of config/master.key (required)
#   POSTGRES_PASSWORD  letters and digits only, it is embedded in DATABASE_URL (required)
#   BASE_URL           the public URL, https://... behind a TLS reverse proxy
#   APP_PORT, APP_BIND published port (3000) and address (127.0.0.1: the proxy talks to it)
# Status: untested on a real host (_product/docs/infra.md). `make prod-smoke` runs it
# locally with throwaway data (docker-compose.smoke.yml).
name: scam-shield-prod

services:
  app:
    build:
      context: ../..
      dockerfile: .infra/prod/Dockerfile
    image: ${APP_IMAGE:-scam-shield:prod}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      DATABASE_URL: postgres://scam_shield:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (letters and digits)}@postgres:5432/scam_shield
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY (64 hex characters, the content of config/master.key)}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scam_shield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (letters and digits)}
      POSTGRES_DB: scam_shield
    volumes:
      - ./_volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U scam_shield -d scam_shield"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
