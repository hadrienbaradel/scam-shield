# Prudence (code name scam-shield) in production on the OVH host: the app (built from the Dockerfile
# here), Postgres, and cloudflared for heyprudence.com once a tunnel token is set. Postgres data lives in
# a bind mount at .infra/prod/_volumes/postgres. Settings come from the environment or the .env file next
# to this file, which `make deploy` writes on the host (mode 600, never shown; _product/docs/ops.md):
#   MASTER_KEY         64 hex characters, the content of config/master.key (required)
#   POSTGRES_PASSWORD  letters and digits only, it is embedded in DATABASE_URL (required; generated on the host)
#   BASE_URL           the public URL (https://heyprudence.com on the host)
#   TRUST_PROXY        true behind cloudflared, so the visitor's address keys the rate limits
#   GIT_SHA            the deployed commit, baked into the image as APP_VERSION (what /api/health names)
#   LOG_LEVEL          pino level, info by default
#   APP_PORT, APP_BIND published port (3000) and address (127.0.0.1)
#   TUNNEL_TOKEN       the Cloudflare tunnel's token; COMPOSE_PROFILES=cloudflared (also in .env) starts cloudflared
# Docker publishes ports past ufw, so every published port here is on 127.0.0.1. Postgres reaches the tailnet
# through `tailscale serve` on the host (prudence-prod:5432), never through a port on 0.0.0.0.
# `make prod-smoke` runs this file locally with throwaway data (docker-compose.smoke.yml).
name: scam-shield-prod

services:
  app:
    build:
      context: ../..
      dockerfile: .infra/prod/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: ${APP_IMAGE:-scam-shield:prod}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://scam_shield:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (letters and digits)}@postgres:5432/scam_shield
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY (64 hex characters, the content of config/master.key)}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scam_shield
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (letters and digits)}
      POSTGRES_DB: scam_shield
    # Loopback only: the host's `tailscale serve --tcp=5432 tcp://127.0.0.1:5432` is the way in from the tailnet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./_volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U scam_shield -d scam_shield"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # heyprudence.com through a Cloudflare Tunnel: outbound connections only, no published port. Started only
  # with the cloudflared profile, which `make deploy TUNNEL_TOKEN=...` enables in the host .env.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [cloudflared]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
