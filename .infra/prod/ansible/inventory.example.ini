# Copy to inventory.ini (ignored by git) and fill in the host: its public address, or its tailnet
# name (prudence-prod) once Tailscale SSH works. Secrets never go here: make deploy reads the master
# key from config/master.key, the Postgres password is generated on the host, and the Tailscale auth
# key comes from the environment (make deploy TS_AUTHKEY=...) or .tailscale-authkey next to this file.
[scam_shield]
prudence-prod ansible_host=203.0.113.10 ansible_user=ubuntu

[scam_shield:vars]
# true until Tailscale SSH is verified; false closes port 22 to the internet (only the tailnet reaches it).
ssh_public=true
# Optional overrides (defaults in playbook.yml):
# scam_shield_base_url=https://heyprudence.com
# scam_shield_app_port=3000
# scam_shield_log_level=info
