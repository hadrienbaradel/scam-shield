# Copy to inventory.ini (ignored by git) and fill in the host: its Tailscale address (100.127.78.127, the
# machine meikit; meikit.tail2c017.ts.net where MagicDNS is on), or its public address while port 22 is
# open to the internet. Secrets never go here: make deploy reads the master key from config/master.key,
# the Postgres password is generated on the host, the Tailscale auth key comes from the environment
# (make deploy TS_AUTHKEY=...) or .tailscale-authkey next to this file, and the tunnel token from the
# environment (make deploy TUNNEL_TOKEN=...).
[scam_shield]
meikit ansible_host=100.127.78.127 ansible_user=ubuntu

[scam_shield:vars]
# false closes port 22 to the internet (only the tailnet reaches it); true keeps it open (a first deploy over
# the public address, before Tailscale SSH works).
ssh_public=false
# Optional overrides (defaults in playbook.yml):
# scam_shield_base_url=https://heyprudence.com
# scam_shield_app_port=3000
# scam_shield_log_level=info
# A teammate's public SSH key goes in group_vars/scam_shield.yml (gitignored), as a list:
#   authorized_keys:
#     - ssh-ed25519 AAAA... name@laptop
