id: gift-cards
order: 7
title: The gift card trap
character: Mr. Gift Card
emoji: "🎁"
minutes: 1
badge: Gift card guard
rule: Nobody official is ever paid in gift cards. Anyone who asks for them is a scammer.
demo_case: B7
steps:
  - chat:
      - Hello! Got a minute? Today's story has a villain. His name is Mr. Gift Card.
      - Do you ever buy gift cards? For a grandchild's birthday, maybe?
    replies:
      - say: All the time. So handy.
        answer: They make a lovely present. He likes them for another reason. Let me tell you about Monday.
      - say: Never. I give cash.
        answer: A birthday card with cash inside. The classic! Let me tell you about Monday.
      - say: Why? Is that bad?
        answer: Not at all. Buying one for a grandchild is fine. Wait until you see what he does with them.
  - say:
      - Monday, 10 in the morning. The coffee is ready, and the phone rings.
  - from: character
    as: Your power company
    say:
      - This is your power company. Your bill is late. Pay **$480** by noon, or we cut the power.
      - We only take **gift cards** today. Scratch the silver strip for me and read me the numbers. I never have a coin.
  - ask: What do you do?
    choices:
      - text: Buy just one card, to be safe.
        reply: One card! Splendid. Then one for the late fee. Then one for the fee on the late fee.
        tell: No power company takes gift cards. Not one card, not ever.
      - text: Ask if I can pay by check instead.
        reply: A check? Checks can be stopped. Gift cards cannot. That is why I adore them.
        tell: Only a scammer insists on gift cards. Hang up.
      - text: Hang up, then call the number on my power bill.
        right: true
        reply: The number on your bill? That rings the REAL power company. They have never heard of me.
        tell: Your own bill gives you the real number. No power company, bank or tax office takes gift cards.
  - chat:
      - So? You called the number on your bill. What did they say?
    replies:
      - say: My bill is paid. All fine.
        answer: Of course. He made the late bill up. Wednesday, an email arrives with your friend Mark's name on it.
      - say: They never heard of him!
        answer: Nobody there ever has. Wednesday, an email arrives with your friend Mark's name on it.
      - say: Why gift cards, though?
        answer: Once he has the numbers, the money is gone in minutes. Wednesday, an email arrives with your friend Mark's name on it.
  - from: character
    as: Mark
    say:
      - I am in Madrid and my wallet was stolen! Can you buy 4 gift cards of $200 and send me the codes?
      - And please, do not tell anyone.
  - ask: What now?
    choices:
      - text: Send them. Mark would do the same for me.
        reply: Thank you, thank you! Just send a photo of the backs. Ah, those lovely silver strips.
        tell: Anyone who asks for gift cards is a scammer, even with a friend's name. Call Mark on the number you have.
      - text: Call Mark on the number I already have.
        right: true
        reply: You called the REAL Mark? He is at home in his slippers, nowhere near Madrid.
        tell: The number you already have reaches the real Mark. Whoever wants gift cards is someone else.
      - text: Reply to the email to ask if he is all right.
        reply: I am fine, just in a hurry! The cards, please. And a coin, if you have one.
        tell: A reply goes to whoever wrote the email. Call Mark on the number you already have.
  - chat:
      - Two tries, two misses. Mr. Gift Card is having a bad week.
      - Friday, your neighbor Rosa knocks, her phone on speaker. She's off to buy gift cards before noon.
    replies:
      - say: Oh no. Not Rosa!
        answer: Oh yes. Listen to who's on her phone.
      - say: Is it him again?
        answer: It is. Same voice, same hurry. Listen.
  - from: character
    as: Power company
    say:
      - Hurry, Rosa! Gift cards by noon, or the lights go out! And bring a coin. I never have one.
  - ask: And now?
    choices:
      - text: Tell her to hang up. Nobody official is paid in gift cards.
        right: true
        reply: You TOLD her? Now she will tell the whole street. My week is ruined.
        tell: One sentence can save a neighbor $480. Nobody official is ever paid in gift cards.
      - text: Offer to drive her to the store. It is nearly noon.
        reply: How kind! Drive fast. I will keep her on the line all the way there.
        tell: No power company takes gift cards. The kind thing is to tell Rosa so.
      - text: Say nothing. It is her business.
        reply: Perfect. Her business is my business now.
        tell: "Speaking up is not meddling. Tell her: nobody official is ever paid in gift cards."
  - chat:
      - Rosa hangs up and calls the number on her bill. Nothing is late.
      - She's still a little shaken. Ask her in for coffee?
    replies:
      - say: Come in, Rosa!
        answer: She's in before the kettle boils.
      - say: Yes, and I've got cake.
        answer: Coffee and cake. Rosa feels better already.
      - say: I'll tell her about Mark.
        answer: She laughs so hard she spills her coffee. The same man, all week!
  - say:
      - Mr. Gift Card goes home with empty pockets. No cards, no codes, and still no coin.
