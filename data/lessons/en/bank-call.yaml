id: bank-call
order: 4
title: The bank calls you
character: The Bank That Forgot Your Name
emoji: "🏦"
minutes: 1
badge: Hang-up hero
rule: When "your bank" calls about fraud, hang up and call the number on the back of your card.
demo_case: D4
steps:
  - say:
      - Thursday, 2:30 in the afternoon. You are writing a birthday card.
      - In a back room far away, the **Bank That Forgot Your Name** clears its throat. It calls everyone Dear Customer.
      - Your phone buzzes.
  - from: character
    as: Chase
    say:
      - "Chase fraud alert: did you send **$1,250**? Reply NO to stop it."
  - ask: What do you do?
    choices:
      - text: Reply NO, so they stop the payment.
        reply: NO! Lovely. Now I know this number answers. I will call you myself, Dear Customer.
        tell: A reply tells him your number works, and his call comes next. Leave the text alone.
      - text: Leave it. I will check with my bank myself.
        right: true
        reply: No reply? I wrote it so nicely. Fine. I will call. Everyone answers a call.
        tell: Not replying tells him nothing. You choose how to reach your bank, not him.
  - say:
      - Two minutes later, the phone rings. The screen says **Chase**.
  - from: character
    as: Chase
    say:
      - Dear Customer! Fraud team here. Thieves are in your account. Move your savings to a **safe account**, now.
  - ask: What now?
    choices:
      - text: Move it fast, before the thieves do.
        reply: Yes! The safe account is very safe. I am the only one with the key.
        tell: The safe account belongs to him. A real bank never asks you to move money to protect it.
      - text: Ask for his name and employee number.
        reply: Brian. Employee number 1-2-3-4. Very real. Now, Dear Customer, your savings.
        tell: A name and a number are easy to make up. A real bank never asks you to move your money.
      - text: Say goodbye and hang up.
        right: true
        reply: You hung up? On the FRAUD TEAM? I had a whole speech, Dear Customer.
        tell: The fraud team that calls to protect you from fraud is the fraud.
  - from: you
    say:
      - Click. Now I want to talk to my real bank.
  - ask: Which number do you call?
    choices:
      - text: The number on the back of my card.
        right: true
        reply: The card. The one number I cannot touch. Goodbye, Dear Customer.
        tell: The number on your card goes to your real bank. You call, so you know who answers.
      - text: The one that just called. It said Chase.
        reply: Hello again, Dear Customer! I made your phone say Chase. Clever, no?
        tell: A name on the screen is easy to fake. Calling it back reaches him again.
      - text: One I find by searching the internet.
        reply: The internet! I paid for an ad there. My number sits right at the top.
        tell: A number found online can be a fake one too. The number on your card is the sure one.
  - say:
      - Your real bank answers. No payment of $1,250. Your savings are right where you left them.
  - say:
      - The Bank That Forgot Your Name tries the next number. Dear Customer? Click.
