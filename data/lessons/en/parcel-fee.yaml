id: parcel-fee
order: 1
title: The $1.99 parcel trap
character: Mr. Tiny Fee
emoji: "📦"
minutes: 1
badge: Parcel-fee spotter
rule: Never pay a delivery fee from a link in a text. Go to the carrier's own website or app.
demo_case: D1
steps:
  - chat:
      - Hello! Got a minute? I want to show you a text that goes around every week.
      - Ever had a text about a parcel you were not expecting?
    replies:
      - say: All the time.
        answer: Same here. Some weeks, one a day. Let's pretend a new one comes to your phone.
      - say: Are they all fake?
        answer: Not all. Real carriers send texts too. That is why the fake ones work. Let's pretend one comes to your phone.
      - say: Never. Nobody texts me.
        answer: Well, I text you! Now let's pretend a parcel text comes to your phone too.
  - say:
      - Tuesday, 7:40 in the morning. The kettle is on.
      - Far away, **Mr. Tiny Fee** shakes his coin jar. Empty again. He picks up his phone.
      - Your phone buzzes.
  - from: character
    as: USPS
    say:
      - "Your parcel is on hold at our depot. A small fee of **$1.99** is due. Pay here: usps-redelivery.example"
  - ask: What do you do?
    choices:
      - text: Pay it. It is only $1.99.
        reply: Wonderful! Now your card number, the date and the three little digits on the back. For $1.99. Promise.
        tell: A $1.99 fee that needs your whole card is not a fee. It is your card.
      - text: Reply and ask if it is really USPS.
        reply: Really USPS? Of course! It says USPS right at the top. I typed it there myself.
        tell: Anyone can type USPS at the top of a text, and he will always say yes. Ask the carrier, not him.
      - text: Look it up myself in the USPS app.
        right: true
        reply: Oh no. Not the app. Nobody checks the app. Fine. FINE.
        tell: Going to the carrier yourself costs nothing and proves everything.
  - chat:
      - The USPS app shows no parcel on hold. Nothing to pay.
    replies:
      - say: Phew.
        answer: Phew indeed. No parcel, no fee. But Mr. Tiny Fee is not done.
      - say: That was easy.
        answer: Easy for you. Sad for Mr. Tiny Fee. But he is not done.
      - say: What did he want?
        answer: Your card number. With it, he spends your money, far more than $1.99. And he is not done.
  - from: character
    as: USPS
    say:
      - "LAST CHANCE: pay **today** or your parcel goes back to the sender. usps-redelivery.example"
  - ask: What now?
    choices:
      - text: Reply STOP, so the texts stop.
        reply: STOP? How lovely. Now I know your number works. I will write again tomorrow.
        tell: Any reply, even STOP, tells him your number works. Leave his texts unanswered.
      - text: Ignore it. I already checked.
        right: true
        reply: Ignored? I wrote LAST CHANCE in capital letters. Capital letters always work. Usually.
        tell: A real carrier leaves a notice and tries again. A new delivery is free.
      - text: Tap the link, just to look.
        reply: Just a look! Come in, come in. My page looks exactly like USPS. I copied every button.
        tell: One look opens his page, and his page asks for your card. Go to the carrier's own app.
  - chat:
      - "Thursday. This time you really are waiting for a parcel: a new teapot."
      - Do you buy things online?
    replies:
      - say: Now and then.
        answer: Then you know the wait. You listen for the doorbell. Your phone buzzes instead.
      - say: Ooh, a teapot!
        answer: A blue one, with a round lid. You listen for the doorbell. Your phone buzzes instead.
      - say: I prefer real shops.
        answer: Real shops are lovely. This teapot came from a website, though. Then your phone buzzes.
  - from: character
    as: USPS
    say:
      - "We could not deliver your parcel. Pay **$1.99** to book a new delivery: usps-redelivery.example"
  - ask: And now?
    choices:
      - text: Check with the tracking number the shop sent me.
        right: true
        reply: The tracking number from the shop? The one thing I cannot fake. Shops ruin everything.
        tell: The shop's tracking number, on the carrier's own website, shows where your parcel really is.
      - text: Pay. This time it really must be my teapot.
        reply: Your teapot! Yes! I know all about your teapot. Lovely teapot. Card number, please.
        tell: He knows nothing about your teapot. He sends the same text to everyone.
  - say:
      - The USPS website says your teapot comes Friday. No fee.
      - Mr. Tiny Fee shakes his coin jar one more time. Not a rattle.
      - The coin jar stays empty.
