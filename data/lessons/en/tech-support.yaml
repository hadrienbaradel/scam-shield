id: tech-support
order: 6
title: The screaming pop-up
character: The Pop-up That Screams
emoji: "🖥️"
minutes: 1
badge: Pop-up silencer
rule: Never call a number shown in a pop-up window. Close it, or turn the computer off.
demo_case: D6
steps:
  - chat:
      - Hi! Today's villain is a pop-up. A very loud one.
      - Has a scary warning ever popped up on your screen?
    replies:
      - say: Yes, and it gave me a fright.
        answer: It's made to give people a fright. Here's how it goes.
      - say: Never, knock on wood.
        answer: Good. Then you meet it here first, where it can't do a thing.
      - say: What kind of warning?
        answer: A red one, with beeps and a phone number. Here's how it goes.
  - say:
      - Thursday afternoon. A cup of tea, the news on the computer.
      - Then the screen turns red, and the computer starts to beep.
  - from: character
    as: Microsoft Security
    say:
      - "**MICROSOFT SECURITY WARNING!** Your computer is infected. Call Microsoft at 1-555-0166. DO NOT CLOSE THIS WINDOW!"
      - BEEP! BEEP! BEEEP! Ahem. Excuse me. I have been screaming at people since breakfast.
  - ask: What do you do?
    choices:
      - text: Call the number. It says Microsoft.
        reply: YES! Ring ring! My friend answers as Microsoft, takes over your computer and charges $299 to fix nothing.
        tell: Microsoft never puts a phone number in a warning. That number rings the people who made the pop-up.
      - text: Close the window.
        right: true
        reply: Not the little X! I beeped! I SCREAMED! I... cough, cough. I need a glass of water.
        tell: It was only a web page dressed up as a warning. Closing it is always safe.
      - text: Click inside the window to read more.
        reply: Come in, come in! One click and I fill the WHOLE screen. I am much bigger than I look.
        tell: A click gives a scary window more room. Close it, and call no one.
  - chat:
      - It's coughing! All that screaming is hard on the throat.
      - Ten minutes later, on another page, it's back. It fills the whole screen, and there's no X.
    replies:
      - say: Oh no. No X!
        answer: No X. It hopes that scares you. Look what it says now.
      - say: Can it hurt my computer?
        answer: It's only a web page. Its whole job is to scare you into calling. Look what it says now.
      - say: It doesn't give up!
        answer: Not on the first try. Look what it says now.
  - from: character
    as: Microsoft Security
    say:
      - Cough. I am BACK! Turn off the computer and you lose ALL your photos! Call 1-555-0166!
  - ask: What now?
    choices:
      - text: Call, just this once, to save my photos.
        reply: Your photos, yes! My friend gets into your computer, pretends to save them and charges $299.
        tell: The threat is there to make you call. Turning the computer off does not harm your photos.
      - text: Click the Cancel button in the window.
        reply: Ha! Every button in here is mine. Cancel just makes me beep louder. Cough.
        tell: Every button inside the window belongs to the pop-up. The power button on the computer does not.
      - text: Hold down the power button.
        right: true
        reply: Not the power button! Nobody hears me scream at a computer that is off. Croak.
        tell: Holding the power button turns the computer off, and no web page can stop it.
  - chat:
      - The screen goes dark. When you turn it back on, your photos are all still there.
      - Saturday morning, the phone rings. The voice on the line is very, very hoarse.
    replies:
      - say: I think I know that voice.
        answer: I think you do. Here's what he says.
      - say: Does he have a cold?
        answer: From all that screaming, I'd say so. Here's what he says.
  - from: character
    as: Microsoft Support
    say:
      - Croak. Hello, Microsoft here. Your computer is sending us errors. Let me connect to it and fix it.
  - ask: And now?
    choices:
      - text: Hang up. Microsoft does not call like this.
        right: true
        reply: Click? You hung up on me? Three tries, and not one call. Now I have no voice left at all.
        tell: Microsoft does not call people out of the blue. Hanging up is always allowed.
      - text: Let him connect. My computer did act up this week.
        reply: It did? What luck! From my desk I can see your screen, your files, your bank. Croak.
        tell: Never let a caller take over your computer. Microsoft does not phone people to fix theirs.
      - text: Ask for his employee number first.
        reply: Of course! It is 1-2-3-4-5. Very official. Now let me in. Croak.
        tell: "A caller can make up any number he likes. Hang up: Microsoft does not phone people about computers."
  - chat:
      - You hung up. Saturday is quiet again.
      - Time for a cup of tea?
    replies:
      - say: Yes, a big one.
        answer: You've earned it. Three tries, and he got nothing.
      - say: With honey, please.
        answer: Good idea. Somebody else needs honey more than you today.
      - say: Will he call again?
        answer: He might. Now you know the trick, and hanging up is always allowed.
  - say:
      - The Pop-up That Screams has no voice left, and nobody called its number.
      - It is in bed with hot honey and lemon.
