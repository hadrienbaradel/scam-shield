id: grandchild
order: 2
title: It's me, Grandma!
character: Cousin Stuck Abroad
emoji: "👵"
minutes: 1
badge: Call-back champion
rule: If family asks for money in a hurry, call them back on the number you already have.
demo_case: B2
steps:
  - chat:
      - Hello! Today's story is about family.
      - Does your family text you, or do they call?
    replies:
      - say: They text. All day long.
        answer: Lovely. Then a text from family feels normal. Let's pretend a text comes to your phone.
      - say: They call. I like a voice.
        answer: A call is a good habit. Keep it. Let's pretend a text comes to your phone.
      - say: Depends who!
        answer: Ha, true. Grandsons text, sisters call. Let's pretend a text comes to your phone.
  - say:
      - Sunday, 6 in the evening. The soup is on the stove.
      - Somewhere, **Cousin Stuck Abroad** spins his globe. Where will he be stuck today?
      - Your phone buzzes. A number you do not know.
  - from: character
    as: +1 555-0161
    say:
      - Hi Grandma, it's me! New number. I'm stuck in **Lisbon**. Can you send **$300** today? I'll explain later.
  - ask: What do you do?
    choices:
      - text: Send it. He is family, and he needs help.
        reply: Thank you, Grandma! You are my favorite grandmother. Of all the ones I text today.
        tell: "A new number, trouble far away, money today: those are his clues. Call before you send."
      - text: "Text back: what is the dog's name?"
        reply: The dog! Good old... the dog. The dog is fine. No time for the dog, Grandma.
        tell: He can dodge a question, or guess right. A call to the number you already have settles it.
      - text: Call my grandson on the number I already have.
        right: true
        reply: The old number? Oh no. That is the one the real grandson answers.
        tell: The number you already have reaches your real grandson. A new number proves nothing.
  - chat:
      - His usual number rings and rings. He must be at work. You leave a message.
    replies:
      - say: I hope he is all right.
        answer: He is fine. You will see. Meanwhile, the new number writes again.
      - say: Typical! He never picks up.
        answer: Ha! Busy, as usual. Meanwhile, the new number writes again.
      - say: What if it really is him?
        answer: Then he will be glad you checked. Meanwhile, the new number writes again.
  - from: character
    as: +1 555-0161
    say:
      - Grandma, hurry! I'm in **Madrid** now. My lawyer is sending a man to your door for the cash.
  - ask: What now?
    choices:
      - text: Get the cash ready for the man.
        reply: Lovely! An envelope will do. My man is very polite. He even wipes his feet.
        tell: A real lawyer or police officer never sends someone to your door to collect cash.
      - text: No cash for anyone at my door.
        right: true
        reply: No envelope? But I booked my man for the whole afternoon!
        tell: Cash at the door is his trick. No real lawyer sends for it, or asks for gift cards.
      - text: Ask for the lawyer's name and number.
        reply: Of course! Mr. Smith, lawyer. His number is this one, funnily enough.
        tell: A name and a number are easy to make up. No real lawyer sends someone to collect cash.
  - chat:
      - Lisbon, then Madrid. He travels a lot for a man who is stuck.
    replies:
      - say: Nobody gets cash at my door.
        answer: Not today, not ever. So he tries another trick.
      - say: Ha! Where to next?
        answer: Wait and see. His globe is spinning again.
      - say: Is he really stuck?
        answer: Not at all. He picks a city on his globe. And now he tries another trick.
  - from: character
    as: +1 555-0161
    say:
      - Grandma? Are you there? Please **don't tell Mom**. I'm in **Rome** now. It's complicated.
  - ask: And then?
    choices:
      - text: Keep his secret. He sounds ashamed.
        reply: Yes! Our little secret. Mom asks far too many questions.
        tell: The secret is there so no one checks his story. One call to the family breaks it.
      - text: Call his mother right away.
        right: true
        reply: Not Mom! Mom knows where everyone is. Mom ALWAYS knows.
        tell: One call to the family, and his story falls apart.
  - say:
      - His mother answers. Your grandson is at work in town, with the same old number.
  - say:
      - Cousin Stuck Abroad spins his globe again. Three countries, not one dollar.
      - Your soup is ready.
