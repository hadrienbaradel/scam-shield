id: romance-crypto
order: 8
title: Too sweet to be true
character: The Friend Who Never Video-Calls
emoji: "💘"
minutes: 1
badge: Big heart, closed wallet
rule: Someone you have never met who talks about money is not a friend. Send them nothing.
demo_case: B12
steps:
  - chat:
      - Hello! This story is about a man who writes very sweet messages.
      - Have you ever made a friend online? Someone you've never met in person?
    replies:
      - say: Yes, a lovely one.
        answer: How nice. James, in this story, writes sweet messages too. Watch what he asks for.
      - say: No. I like real faces.
        answer: Real faces matter. James, in this story, never shows his.
      - say: Is that safe?
        answer: Often it is. Here's a story where it isn't.
  - say:
      - "Sunday evening. For six weeks, James has written every day: good morning, good night, photos of the sea."
      - His messages are warm. It is nice to be thought of.
  - from: character
    as: James
    say:
      - My dear, my camera is broken again. The salt air on this oil rig. No video call tonight.
      - But I have news! My crypto doubles every month. Put in **$2,000** with me, and we build our future together.
  - ask: What do you do?
    choices:
      - text: Send $200 first, to see if it grows.
        reply: Lovely! Watch it grow on my website. It always grows on my website. Now, the other $1,800?
        tell: His website shows whatever numbers he types. Money that doubles every month is a story.
      - text: Ask for a video call before anything else.
        reply: A video call? Alas, my camera. The salt air, the seagulls, the storm. It is always something.
        tell: "His excuse is the answer: six weeks, never one video call, and now money. Send nothing."
      - text: Send nothing. I have never met him, and he is talking money.
        right: true
        reply: Nothing? Not even a little? But my camera... I mean, my heart. My heart is broken.
        tell: Someone you have never met who talks about money is not a friend. Your heart can stay open.
  - chat:
      - "You write back to James: no money for someone you've never met."
      - Was that hard to say, after six weeks of sweet messages?
    replies:
      - say: A little. He seems kind.
        answer: It's hard. Saying no to money is not saying no to kindness. Here's his answer.
      - say: Not at all.
        answer: Good for you. Here's his answer.
      - say: Will he be hurt?
        answer: He'll say he is. That's part of his plan. Here's his answer.
  - from: character
    as: James
    say:
      - I thought you loved me. I am on my way to you, but stuck at customs. One fee of **$900**, and I am yours.
  - ask: What now?
    choices:
      - text: Stay kind, and still send nothing.
        right: true
        reply: Kind, and careful too? That is the worst sort of person for me.
        tell: You can be warm and still say no. Kindness never needs money.
      - text: Pay it. Then at last we can meet.
        reply: Wonderful! Then comes the ticket fee. Then the hotel fee. I am always one fee away from you.
        tell: There is always one more fee. Someone who truly wants to meet you does not need your money.
      - text: Send half, to show that I care.
        reply: Half is a lovely start! I will ask for the other half on Thursday.
        tell: Half a fee is still money to a stranger. You can care without paying.
  - chat:
      - His camera never works, and he never arrives. There's always one more fee.
      - A few days later, he tries something new.
    replies:
      - say: What is it this time?
        answer: A secret. Here it is.
      - say: Poor man, stuck at customs.
        answer: He's not at customs. He's at a desk, writing the same words to many people. Here's his next one.
      - say: He doesn't give up, does he?
        answer: Not yet. Here's his next message.
  - from: character
    as: James
    say:
      - Your family would not understand us. Let us keep this **between us**, my dear.
  - ask: And then?
    choices:
      - text: Keep it to myself. It is my private life.
        reply: Yes! Just you and me. And nobody to tell you what I really am.
        tell: The secret keeps away the people who could warn you. Tell someone you trust.
      - text: Tell my family all about James.
        right: true
        reply: Your FAMILY? They will want to see my face. Nobody sees my face.
        tell: The people who love you are his worst enemy. One talk with them, and the trick falls apart.
      - text: Ask him why it must be a secret.
        reply: Because your family would see through me in a second. I mean... because I love you.
        tell: A stranger who wants to be hidden from your family is hiding something. Tell someone you trust.
  - chat:
      - You call your family. Lunch on Tuesday, and you tell them everything.
      - How does it go?
    replies:
      - say: They're glad I told them.
        answer: Of course they are. With them by your side, he has no chance.
      - say: We laugh about his camera.
        answer: Six weeks, and not one video call. I'd laugh too.
      - say: Should I block him?
        answer: Yes. Block him and stop answering. You owe him no goodbye.
  - say:
      - The Friend Who Never Video-Calls goes back to his oil rig. His camera is still broken, and so is his plan.
      - Ever sent money to someone like him? Many people have. Tell your family and call your bank.
