id: codes
order: 5
title: The "read me the code" trick
character: Mr. Read-Me-The-Code
emoji: "🔑"
minutes: 1
badge: Code keeper
rule: A code sent to you is a key. Never read it out or send it to anyone who calls or writes.
demo_case: B10
steps:
  - say:
      - Saturday, 11 in the morning. You are reading the paper.
      - Somewhere, **Mr. Read-Me-The-Code** sharpens his pencil. Ready for six little numbers.
      - The phone rings.
  - from: character
    as: Your bank
    say:
      - Good morning! Your bank here. I am sending you a code by text. Just read it to me, to protect your account.
  - ask: A code arrives by text. What do you do?
    choices:
      - text: Read it to him. It is only six numbers.
        reply: Four, eight, two... Lovely! I write it all down. Your account thanks you. Well, I do.
        tell: Those six numbers can open your account to him. A code is for your eyes only.
      - text: Keep it to myself and hang up.
        right: true
        reply: Hung up? My pencil was ready! Do you know how long I sharpened it?
        tell: The door stays locked. A code is a key, and it stays with you.
      - text: Ask him why he needs it.
        reply: To protect you, of course! I always have a lovely reason. I keep a whole list.
        tell: He always has a reason ready. No reason is good enough for your code.
  - from: you
    say:
      - "I read the text again. It says: **do not share this code**. Even my bank says so."
  - from: character
    as: Your bank
    say:
      - We were cut off! It is me, your bank. Surely you can read the code to your own bank?
  - ask: What now?
    choices:
      - text: Read it. He says he is my bank.
        reply: Yes! Your bank. Me. Same thing. Slowly, please. My pencil is ready.
        tell: Anyone can say he is your bank. A real bank never calls to ask for a code.
      - text: Ask him to prove he is my bank.
        reply: Easy! I know your name and your bank's name. There, proof! Now, the code.
        tell: Knowing your name proves nothing. A real bank never calls to ask for a code.
      - text: Keep it. Not even my bank gets my code.
        right: true
        reply: Not even your own bank? But I said please. Twice.
        tell: Your bank already has your money. It does not need your code as well.
  - say:
      - Sunday. A text from a number you do not know.
  - from: character
    as: +1 555-0155
    say:
      - Hi Grandma, I sent you my WhatsApp code by mistake. Can you send it back? It's the 6-digit one.
  - ask: And now?
    choices:
      - text: Send it back. He is my grandson, after all.
        reply: Thank you, Grandma! Your WhatsApp is mine now. All your chats too.
        tell: That code opens your WhatsApp to him. A code you did not ask for stays with you.
      - text: Keep it, and call my grandson myself.
        right: true
        reply: You called the real one? But my grandson costume was brand new!
        tell: "A code you did not ask for is a warning: someone may be trying to get in."
      - text: Ask him to call me first, to be sure.
        reply: Call? I can't, I have a sore throat. Just the code, Grandma. Quickly.
        tell: He will always find a reason not to call. A code you did not ask for stays with you.
  - from: you
    say:
      - I call my grandson. He is at football practice. He sent no code.
  - say:
      - Mr. Read-Me-The-Code puts his pencil away. Still sharp. Not one number written.
