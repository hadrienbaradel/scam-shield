id: codes
order: 5
title: Le piège du « lisez-moi le code »
character: Monsieur Lisez-moi-le-code
emoji: "🔑"
minutes: 1
badge: Gardien des codes
rule: Un code reçu est une clé. Ne le donnez jamais à quelqu'un qui vous appelle ou vous écrit.
demo_case: A2
steps:
  - chat:
      - Bonjour ! Aujourd'hui, on parle des petits codes qui arrivent par SMS. Six chiffres, en général.
      - Vous en recevez, parfois ?
    replies:
      - say: Oui, plein !
        answer: Il y en a partout, maintenant. Imaginons qu'on vous appelle à propos d'un code.
      - say: Parfois. Ça sert à quoi ?
        answer: À prouver que c'est bien vous qui entrez dans votre compte, comme une clé. Imaginons qu'on vous appelle à propos d'un code.
      - say: Jamais vu ça.
        answer: Alors en voici un premier. Imaginons qu'on vous appelle à propos d'un code.
  - say:
      - Samedi, 11 h. Vous lisez le journal.
      - Quelque part, **Monsieur Lisez-moi-le-code** taille son crayon. Prêt pour six petits chiffres.
      - Le téléphone sonne.
  - from: character
    as: Votre banque
    say:
      - Bonjour ! Ici votre banque. Je vous envoie un code par SMS. Lisez-le-moi, c'est pour protéger votre compte.
  - ask: Un code arrive par SMS. Que faites-vous ?
    choices:
      - text: Je le lis. Ce ne sont que six chiffres.
        reply: Quatre, huit, deux... Merci ! Je note tout. Votre compte vous remercie. Enfin, moi.
        tell: Ces six chiffres peuvent lui ouvrir votre compte. Un code, c'est pour vos yeux seulement.
      - text: Je le garde pour moi et je raccroche.
        right: true
        reply: Raccroché ? Mon crayon était prêt ! Vous savez combien de temps je l'ai taillé ?
        tell: La porte reste fermée. Un code est une clé, et elle reste chez vous.
      - text: Je lui demande pourquoi il en a besoin.
        reply: Pour vous protéger, voyons ! J'ai toujours une belle raison. J'en ai toute une liste.
        tell: Il a toujours une raison toute prête. Aucune ne suffit pour avoir votre code.
  - chat:
      - "Le SMS avec le code se termine en petites lettres : **ne communiquez ce code à personne**."
    replies:
      - say: Même ma banque le dit !
        answer: Même votre banque, et par écrit. Et le téléphone sonne encore.
      - say: Je ne lis jamais la fin.
        answer: Presque personne ne la lit. C'est écrit petit, tout en bas. Et le téléphone sonne encore.
      - say: Alors pourquoi il le demandait ?
        answer: Parce que ce code peut lui ouvrir votre compte. Et le téléphone sonne encore.
  - from: character
    as: Votre banque
    say:
      - On a été coupés ! C'est moi, votre banque. Vous pouvez bien lire le code à votre propre banque ?
  - ask: Et maintenant ?
    choices:
      - text: Je le lis. Il dit être ma banque.
        reply: Oui ! Votre banque. Moi. C'est pareil. Lentement, s'il vous plaît, mon crayon est prêt.
        tell: N'importe qui peut se dire votre banque. Une vraie banque n'appelle jamais pour demander un code.
      - text: Je lui demande de prouver qu'il est ma banque.
        reply: Facile ! Je connais votre nom et celui de votre banque. Voilà, preuve faite ! Le code, maintenant.
        tell: Connaître votre nom ne prouve rien. Une vraie banque n'appelle jamais pour demander un code.
      - text: Je le garde. Même ma banque n'aura pas mon code.
        right: true
        reply: Même pas votre propre banque ? J'ai pourtant dit s'il vous plaît. Deux fois.
        tell: Votre banque a déjà votre argent. Elle n'a pas besoin de votre code en plus.
  - chat:
      - Pas un seul chiffre pour son crayon. Il abandonne, pour aujourd'hui.
    replies:
      - say: Ha ! Pauvre crayon.
        answer: Bien taillé, et rien à écrire. Dimanche, un SMS arrive d'un numéro inconnu.
      - say: Il va revenir.
        answer: Vous le connaissez bien ! Dimanche, un SMS arrive d'un numéro inconnu.
      - say: Il s'arrête un jour ?
        answer: Pas vraiment, non. Dimanche, un SMS arrive d'un numéro inconnu.
  - from: character
    as: 01 99 00 12 34
    say:
      - Mamie, je t'ai envoyé mon code WhatsApp par erreur. Tu peux me le renvoyer ? Celui à 6 chiffres.
  - ask: Et là ?
    choices:
      - text: Je le renvoie. C'est mon petit-fils, après tout.
        reply: Merci, Mamie ! Ton WhatsApp est à moi. Et toutes tes conversations avec.
        tell: Ce code ouvre votre WhatsApp. Un code que vous n'avez pas demandé reste avec vous.
      - text: Je le garde. J'appelle mon petit-fils moi-même.
        right: true
        reply: Tu appelles le vrai ? Mais mon costume de petit-fils était tout neuf !
        tell: "Un code que vous n'avez pas demandé est un signal : quelqu'un essaie peut-être d'entrer."
      - text: Je lui demande de m'appeler d'abord, pour vérifier.
        reply: Appeler ? Impossible, j'ai une extinction de voix. Juste le code, Mamie. Vite.
        tell: Il trouvera toujours une raison de ne pas appeler. Un code non demandé reste avec vous.
  - say:
      - Vous appelez votre petit-fils. Il est au foot, et il n'a envoyé aucun code.
      - Monsieur Lisez-moi-le-code range son crayon. Toujours pointu. Pas un chiffre noté.
