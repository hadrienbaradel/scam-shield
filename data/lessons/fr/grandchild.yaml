id: grandchild
order: 2
title: Mamie, c'est moi !
character: Le Petit-fils en détresse
emoji: "👵"
minutes: 1
badge: Pilier de la famille
rule: Si un proche demande de l'argent en urgence, rappelez-le au numéro que vous avez déjà.
demo_case: B1
steps:
  - say:
      - Dimanche, 18 h. La soupe mijote.
      - Quelque part, le **Petit-fils en détresse** ouvre son carnet de malheurs. Lequel, aujourd'hui ?
      - Votre téléphone vibre. Un numéro inconnu.
  - from: character
    as: 01 99 00 12 34
    say:
      - Mamie, c'est moi ! J'ai changé de numéro. J'ai eu un **accident**. Tu peux m'envoyer **300 €** aujourd'hui ?
  - ask: Que faites-vous ?
    choices:
      - text: J'envoie l'argent. C'est la famille, il a besoin d'aide.
        reply: Merci, Mamie ! Tu es ma mamie préférée. De toutes celles à qui j'écris aujourd'hui.
        tell: "Un nouveau numéro, un malheur, de l'argent tout de suite : ce sont ses indices. Appelez avant d'envoyer."
      - text: Je lui demande le nom du chien, pour vérifier.
        reply: Le chien ! Euh... Médor ? Le chien va très bien. Pas le temps pour le chien, Mamie.
        tell: Il peut esquiver une question, ou deviner juste. Un appel au numéro que vous avez déjà règle tout.
      - text: J'appelle mon petit-fils au numéro que j'ai déjà.
        right: true
        reply: L'ancien numéro ? Oh non. C'est celui où le vrai répond.
        tell: Le numéro que vous avez déjà mène à votre vrai petit-fils. Un nouveau numéro ne prouve rien.
  - say:
      - Son numéro habituel sonne dans le vide. Il doit être au travail. Vous laissez un message.
  - from: character
    as: 01 99 00 12 34
    say:
      - Mamie, vite ! En plus, on m'a **volé mon portefeuille**. Mon avocat envoie quelqu'un chercher l'argent chez toi.
  - ask: Et maintenant ?
    choices:
      - text: Je prépare l'argent pour le coursier.
        reply: Parfait ! Une enveloppe suffira. Mon coursier est très poli. Il s'essuie même les pieds.
        tell: Un vrai avocat ou un vrai policier n'envoie jamais quelqu'un chercher de l'argent chez vous.
      - text: Je ne donne d'argent à personne à ma porte.
        right: true
        reply: Pas d'enveloppe ? Mais j'avais réservé mon coursier pour tout l'après-midi !
        tell: L'argent remis à domicile, c'est sa ruse. Aucun vrai avocat n'envoie quelqu'un le chercher.
      - text: Je demande le nom et le numéro de l'avocat.
        reply: Bien sûr ! Maître Martin, avocat. Son numéro ? Celui-ci, justement. Quel hasard.
        tell: Un nom et un numéro s'inventent en une seconde. Aucun vrai avocat n'envoie chercher de l'argent.
  - from: you
    say:
      - Personne ne vient chercher d'argent chez moi. Ni aujourd'hui, ni jamais.
  - from: character
    as: 01 99 00 12 34
    say:
      - Mamie ? Tu es là ? Surtout, **n'en parle pas à papa**. Et là, je suis **à l'hôpital**. C'est compliqué.
  - ask: Et là ?
    choices:
      - text: Je garde son secret. Il a l'air d'avoir honte.
        reply: Oui ! Notre petit secret. Papa pose beaucoup trop de questions.
        tell: Le secret est là pour que personne ne vérifie son histoire. Un appel à la famille le brise.
      - text: J'appelle son père tout de suite.
        right: true
        reply: Pas papa ! Papa sait toujours où est tout le monde. TOUJOURS.
        tell: Un appel à la famille, et son histoire tombe à l'eau.
  - say:
      - Son père décroche. Votre petit-fils est au travail, en ville, avec son numéro de toujours.
  - say:
      - Le Petit-fils en détresse referme son carnet de malheurs. Trois malheurs, zéro euro.
      - Votre soupe est prête.
