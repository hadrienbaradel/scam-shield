id: tech-support
order: 6
title: La fenêtre qui hurle
character: La Fenêtre qui hurle
emoji: "🖥️"
minutes: 1
badge: Pro du bouton Fermer
rule: N'appelez jamais un numéro affiché dans une fenêtre d'alerte. Fermez-la, ou éteignez l'ordinateur.
steps:
  - chat:
      - Bonjour ! La méchante du jour est une fenêtre qui s'ouvre sur l'écran. Et elle crie très fort.
      - Vous avez déjà vu une alerte qui fait peur sur votre ordinateur ?
    replies:
      - say: Oui, et j'ai eu peur.
        answer: C'est normal. Elle est faite exprès pour faire peur. Voici comment ça se passe.
      - say: Jamais, je touche du bois.
        answer: Tant mieux. Alors vous la rencontrez d'abord ici, où elle ne peut rien faire.
      - say: Quel genre d'alerte ?
        answer: Une alerte rouge, qui bipe, avec un numéro de téléphone. Voici comment ça se passe.
  - say:
      - Jeudi après-midi. Un café, les infos sur l'ordinateur.
      - Soudain, l'écran devient rouge et l'ordinateur se met à biper.
  - from: character
    as: Sécurité Microsoft
    say:
      - "**ALERTE DE SÉCURITÉ MICROSOFT !** Votre ordinateur est infecté. Appelez le 01 99 00 12 34. NE FERMEZ PAS CETTE FENÊTRE !"
      - BIP ! BIP ! BIIIP ! Hum. Pardon. Je hurle sur les gens depuis le petit-déjeuner.
  - ask: Que faites-vous ?
    choices:
      - text: J'appelle le numéro. C'est écrit Microsoft.
        reply: OUI ! Dring ! Mon ami répond « Microsoft », prend la main sur votre ordinateur et facture 299 € pour ne rien réparer.
        tell: Microsoft ne met jamais de numéro de téléphone dans une alerte. Ce numéro sonne chez ceux qui ont créé la fenêtre.
      - text: Je ferme la fenêtre.
        right: true
        reply: Pas la petite croix ! J'ai bipé ! J'ai HURLÉ ! Je… kof, kof. Il me faut un verre d'eau.
        tell: Ce n'était qu'une page web déguisée en alerte. La fermer ne présente aucun risque.
      - text: Je clique dans la fenêtre pour en savoir plus.
        reply: Entrez, entrez ! Un clic, et je prends TOUT l'écran. Je suis bien plus grande que j'en ai l'air.
        tell: Un clic donne plus de place à une fenêtre qui fait peur. Fermez-la, et n'appelez personne.
  - chat:
      - La fenêtre tousse ! Tous ces cris, ça fait mal à la gorge.
      - Dix minutes plus tard, sur une autre page, la revoilà. En plein écran, et sans croix.
    replies:
      - say: Oh non. Pas de croix !
        answer: Pas de croix. Elle espère que ça vous fera peur. Regardez ce qu'elle dit maintenant.
      - say: Elle peut abîmer mon ordinateur ?
        answer: Ce n'est qu'une page web. Son seul but, c'est de vous faire peur pour que vous appeliez. Regardez ce qu'elle dit.
      - say: Elle n'abandonne pas !
        answer: Pas après un seul essai, non. Regardez ce qu'elle dit maintenant.
  - from: character
    as: Sécurité Microsoft
    say:
      - Kof. Me REVOILÀ ! Éteignez l'ordinateur et vous perdez TOUTES vos photos ! Appelez le 01 99 00 12 34 !
  - ask: Et maintenant ?
    choices:
      - text: J'appelle, juste cette fois, pour sauver mes photos.
        reply: Vos photos, oui ! Mon ami entre dans votre ordinateur, fait semblant de les sauver et facture 299 €.
        tell: La menace sert à vous faire appeler. Éteindre l'ordinateur n'abîme pas vos photos.
      - text: Je clique sur le bouton Annuler de la fenêtre.
        reply: Ha ! Tous les boutons ici sont à moi. Annuler me fait juste biper plus fort. Kof.
        tell: Chaque bouton dans la fenêtre appartient à la fenêtre. Le bouton marche-arrêt de l'ordinateur, non.
      - text: Je garde le doigt sur le bouton marche-arrêt.
        right: true
        reply: Pas le bouton marche-arrêt ! Personne ne m'entend hurler sur un ordinateur éteint. Kof.
        tell: Un appui long sur le bouton marche-arrêt éteint l'ordinateur, et aucune page web ne peut l'en empêcher.
  - chat:
      - L'écran s'éteint. Quand vous rallumez l'ordinateur, toutes vos photos sont toujours là.
      - Samedi matin, le téléphone sonne. La voix au bout du fil est très, très enrouée.
    replies:
      - say: Je crois connaître cette voix.
        answer: Moi aussi, je crois. Écoutez ce qu'elle dit.
      - say: C'est un rhume ?
        answer: Plutôt à force de hurler, je dirais. Écoutez ce qu'elle dit.
  - from: character
    as: Support Microsoft
    say:
      - Kof. Bonjour, ici Microsoft. Votre ordinateur nous envoie des erreurs. Laissez-moi m'y connecter pour le réparer.
  - ask: Et ensuite ?
    choices:
      - text: Je raccroche. Microsoft n'appelle pas comme ça.
        right: true
        reply: Clic ? Vous m'avez raccroché au nez ? Trois essais, pas un appel. Et je n'ai plus de voix du tout.
        tell: Microsoft n'appelle jamais sans que vous l'ayez demandé. Raccrocher est toujours permis.
      - text: Je le laisse se connecter. Mon ordinateur a fait des siennes cette semaine.
        reply: Ah oui ? Quelle chance ! De mon bureau, je vois votre écran, vos fichiers, votre banque. Kof.
        tell: Ne laissez jamais quelqu'un qui vous appelle prendre la main sur votre ordinateur.
      - text: Je lui demande d'abord son matricule.
        reply: Bien sûr ! Matricule 1-2-3-4-5. Très officiel. Maintenant, laissez-moi entrer. Kof.
        tell: "Au téléphone, on peut inventer n'importe quel matricule. Raccrochez : Microsoft n'appelle pas pour réparer."
  - chat:
      - Vous avez raccroché. Tout est calme à nouveau.
      - Un petit café, pour fêter ça ?
    replies:
      - say: Oui, un grand.
        answer: Vous l'avez bien mérité. Trois essais, et la Fenêtre qui hurle n'a rien obtenu.
      - say: Avec un carré de chocolat !
        answer: Bonne idée. Quelqu'un d'autre aurait bien besoin d'un grog, aujourd'hui.
      - say: Ils vont rappeler ?
        answer: Peut-être. Maintenant, vous connaissez la ruse. Et raccrocher est toujours permis.
  - say:
      - La Fenêtre qui hurle a une extinction de voix, et personne n'a appelé son numéro.
      - Elle est au lit, avec un grog.
