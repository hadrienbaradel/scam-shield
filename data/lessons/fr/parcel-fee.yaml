id: parcel-fee
order: 1
title: Le piège du colis à 1,99 €
character: Monsieur Petits Frais
emoji: "📦"
minutes: 1
badge: Détective des faux frais
rule: Ne payez jamais de frais de livraison depuis un lien dans un SMS. Passez par le site ou l'application du transporteur.
demo_case: A4
steps:
  - say:
      - Mardi, 7 h 40. Le café passe.
      - Au loin, **Monsieur Petits Frais** secoue sa tirelire. Encore vide. Il prend son téléphone.
      - Votre téléphone vibre.
  - from: character
    as: Chronopost
    say:
      - "Votre colis est en attente à notre dépôt. Des frais de **1,99 €** sont à régler. Payez ici : chronopost-suivi.example"
  - ask: Que faites-vous ?
    choices:
      - text: Je paie. Ce n'est que 1,99 €.
        reply: Merveilleux ! Maintenant, votre numéro de carte, la date et les trois petits chiffres au dos. Pour 1,99 €. Promis.
        tell: Des frais de 1,99 € qui demandent toute votre carte, ce ne sont pas des frais. C'est votre carte.
      - text: Je réponds pour demander si c'est vraiment Chronopost.
        reply: Vraiment Chronopost ? Bien sûr ! C'est écrit tout en haut. Je l'ai tapé moi-même.
        tell: N'importe qui peut écrire Chronopost en haut d'un SMS, et il dira toujours oui. Demandez au transporteur, pas à lui.
      - text: Je regarde moi-même dans l'appli Chronopost.
        right: true
        reply: Oh non. Pas l'appli. Personne ne regarde l'appli. Bon. BON.
        tell: Aller vous-même voir le transporteur ne coûte rien et prouve tout.
  - from: you
    say:
      - Je regarde dans l'appli Chronopost. Aucun colis en attente. Rien à payer.
  - from: character
    as: Chronopost
    say:
      - "DERNIER AVIS : payez **aujourd'hui** ou votre colis retourne à l'expéditeur. chronopost-suivi.example"
  - ask: Et maintenant ?
    choices:
      - text: Je réponds STOP pour que ça s'arrête.
        reply: STOP ? Charmant. Maintenant, je sais que votre numéro marche. Je vous réécris demain.
        tell: Une réponse, même STOP, lui confirme que votre numéro marche. Laissez ses SMS sans réponse.
      - text: Je n'y touche pas. J'ai déjà vérifié.
        right: true
        reply: Ignoré ? J'avais écrit DERNIER AVIS en majuscules. Les majuscules marchent toujours. D'habitude.
        tell: Un vrai transporteur laisse un avis de passage et repasse. Demander une nouvelle livraison ne coûte rien.
      - text: Je touche le lien, juste pour voir.
        reply: Juste pour voir ! Entrez, entrez. Ma page ressemble trait pour trait à Chronopost. J'ai copié chaque bouton.
        tell: Un coup d'œil ouvre sa page, et sa page demande votre carte. Passez par l'appli du transporteur.
  - say:
      - "Jeudi. Cette fois, vous attendez vraiment un colis : une nouvelle cafetière."
  - from: character
    as: Chronopost
    say:
      - "Nous n'avons pas pu livrer votre colis. Payez **1,99 €** pour une nouvelle livraison : chronopost-suivi.example"
  - ask: Et là ?
    choices:
      - text: Je vérifie avec le numéro de suivi envoyé par la boutique.
        right: true
        reply: Le numéro de suivi de la boutique ? La seule chose que je ne sais pas imiter. Les boutiques gâchent tout.
        tell: Le numéro de suivi de la boutique, sur le site du transporteur, montre où est vraiment votre colis.
      - text: Je paie. Cette fois, c'est sûrement ma cafetière.
        reply: Votre cafetière ! Oui ! Je la connais très bien, votre cafetière. Superbe. Votre carte, s'il vous plaît.
        tell: Il ne sait rien de votre cafetière. Il envoie le même SMS à tout le monde.
  - from: you
    say:
      - Je tape le numéro de suivi de la boutique sur le site de Chronopost. Ma cafetière arrive vendredi. Sans frais.
  - say:
      - Monsieur Petits Frais secoue sa tirelire une dernière fois. Pas un bruit.
      - La tirelire reste vide.
