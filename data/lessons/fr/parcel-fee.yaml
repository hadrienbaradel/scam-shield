id: parcel-fee
title: Le piège du colis à 1,99 €
character: Monsieur Petits Frais
emoji: "📦"
minutes: 1
badge: Détective des faux frais
rule: Un vrai transporteur ne vous demande jamais de payer des frais par SMS.
demo_case: A4
steps:
  - say:
      - Voici **Monsieur Petits Frais**. Il ne demande jamais grand-chose. Juste 1,99 € pour libérer un colis.
      - Il compte sur une seule pensée. « Ce n'est que deux euros. »
  - ask: Un SMS dit que votre colis est bloqué tant que vous n'avez pas payé 1,99 €. Que faites-vous ?
    choices:
      - text: Je paie. Ce n'est que 1,99 €.
        reply: C'est exactement ce qu'espère Monsieur Petits Frais. Les frais sont un appât ; la page garde votre carte.
      - text: Je vérifie sur le site ou l'appli officielle du transporteur.
        right: true
        reply: Oui ! Votre colis est là où il a toujours été. Monsieur Petits Frais repart les mains vides.
  - say:
      - Son vrai butin, ce n'est pas 1,99 €. C'est **votre numéro de carte**.
      - Une fois qu'il l'a, les petits frais deviennent de gros débits. Pas si petit, finalement.
  - ask: Le SMS dit venir de Chronopost. Comment en être sûr ?
    choices:
      - text: C'est écrit Chronopost, donc c'est Chronopost.
        reply: N'importe qui peut écrire Chronopost. Monsieur Petits Frais l'écrit toute la journée. Un nom dans un SMS ne prouve rien.
      - text: Le SMS ne suffit pas. Je vérifie moi-même auprès de Chronopost.
        right: true
        reply: Exactement. Un nom dans un SMS ne prouve rien ; aller vous-même chez Chronopost prouve tout.
  - say:
      - Il adore presser, aussi. « Payez **aujourd'hui** ou votre colis repart. »
      - Un vrai transporteur laisse un avis de passage et repasse. Demander une nouvelle livraison ne coûte rien.
  - ask: Vous attendez un vrai colis. Quelle est la façon la plus sûre de le suivre ?
    choices:
      - text: Toucher le lien du SMS, juste pour voir.
        reply: Même un coup d'œil ouvre sa page, et il sait parler. Allez plutôt sur l'appli ou le site du transporteur.
      - text: Prendre le numéro de suivi donné par la boutique, sur le site du transporteur.
        right: true
        reply: Parfait. C'est vous qui allez vers eux, donc Monsieur Petits Frais n'obtient rien. Pas même 1,99 €.
      - text: Répondre au SMS pour demander si c'est vrai.
        reply: Il dira oui, bien sûr ! Une réponse lui confirme aussi que votre numéro marche. Demandez au transporteur, pas à lui.
