id: bank-call
order: 4
title: La banque vous appelle
character: La Banque qui a oublié votre nom
emoji: "🏦"
minutes: 1
badge: As du raccrochage
rule: Si « votre banque » appelle pour une fraude, raccrochez et appelez le numéro au dos de votre carte.
demo_case: A6
steps:
  - chat:
      - Bonjour ! Cette histoire commence par un SMS et finit par un coup de téléphone.
      - Votre banque vous envoie parfois des SMS ?
    replies:
      - say: Parfois, oui.
        answer: Oui, les vraies banques en envoient. C'est pour ça que les faux marchent. Je vous raconte une histoire, et vous êtes dedans.
      - say: Jamais.
        answer: Alors un SMS de votre banque vous étonnerait. Je vous raconte une histoire, et vous êtes dedans.
      - say: Pourquoi ? Il s'est passé quelque chose ?
        answer: Rien du tout, pour l'instant ! Je vous raconte une histoire, et vous êtes dedans.
  - say:
      - Jeudi, 14 h 30. Vous écrivez une carte d'anniversaire.
      - Dans une arrière-boutique, la **Banque qui a oublié votre nom** s'éclaircit la voix. Elle dit « Cher client » à tout le monde.
      - Votre téléphone vibre.
  - from: character
    as: Société Générale
    say:
      - Opération suspecte de **700 €** sur votre carte. Si ce n'est pas vous, appelez le 01 99 00 12 34.
  - ask: Que faites-vous ?
    choices:
      - text: J'appelle vite le numéro du SMS.
        reply: Allô ! Service antifraude, cher client. Quelle chance que vous appeliez. Votre numéro de carte ?
        tell: Le numéro d'un SMS mène à celui qui l'a écrit. Votre banque, c'est le numéro au dos de votre carte.
      - text: Je n'appelle pas. Je verrai avec ma banque moi-même.
        right: true
        reply: Pas d'appel ? Moi qui l'avais si bien écrit. Bon. J'appelle, moi. Tout le monde décroche.
        tell: C'est vous qui choisissez comment joindre votre banque, pas lui.
  - chat:
      - Deux minutes plus tard, le téléphone sonne. L'écran affiche **Société Générale**.
    replies:
      - say: Aïe aïe aïe.
        answer: Pas d'inquiétude. Écoutons ce qu'il dit.
      - say: C'est vraiment la Société Générale ?
        answer: On va le savoir. Écoutons ce qu'il dit.
      - say: Il avait dit qu'il appellerait !
        answer: Il l'avait bien dit. Écoutons ce qu'il raconte.
  - from: character
    as: Société Générale
    say:
      - Cher client ! Ici le service antifraude. Des voleurs sont sur votre compte. Virez votre épargne sur un **compte sécurisé**.
  - ask: Et maintenant ?
    choices:
      - text: Je vire l'argent vite, avant les voleurs.
        reply: Oui ! Le compte sécurisé est très sûr. J'en ai la seule clé.
        tell: Le compte sécurisé est le sien. Une vraie banque ne demande jamais de déplacer votre argent pour le protéger.
      - text: Je lui demande son nom et son matricule.
        reply: Monsieur Martin. Matricule 1-2-3-4. Très officiel. Bon, cher client, votre épargne.
        tell: Un nom et un matricule s'inventent en une seconde. Une vraie banque ne fait jamais déplacer votre argent.
      - text: Je dis au revoir et je raccroche.
        right: true
        reply: Raccroché ? Au SERVICE ANTIFRAUDE ? J'avais tout un discours, cher client.
        tell: Le service antifraude qui vous appelle pour vous protéger de la fraude, c'est la fraude.
  - chat:
      - Clic ! La ligne est coupée.
    replies:
      - say: Au revoir, cher client !
        answer: Ha ! Pour une fois, le « cher client », c'est lui. Maintenant, appelons votre vraie banque, pour être tranquille.
      - say: Et si c'était vrai ?
        answer: Alors votre vraie banque vous le dira. Appelons-la, pour être tranquille.
      - say: J'ai le cœur qui bat fort.
        answer: "Il voulait vous faire peur : quand on a peur, on se presse. Respirez un bon coup. Puis appelons votre vraie banque."
  - ask: Quel numéro appelez-vous ?
    choices:
      - text: Le numéro au dos de ma carte.
        right: true
        reply: La carte. Le seul numéro que je ne peux pas toucher. Au revoir, cher client.
        tell: "Le numéro au dos de votre carte mène à votre vraie banque. C'est vous qui appelez : vous savez qui répond."
      - text: Celui qui vient d'appeler. C'était écrit Société Générale.
        reply: Rebonjour, cher client ! C'est moi qui ai fait afficher ce nom. Malin, non ?
        tell: Un nom sur l'écran se truque facilement. Rappeler ce numéro, c'est retomber sur lui.
      - text: Un numéro trouvé en cherchant sur Internet.
        reply: Internet ! J'y ai payé une annonce. Mon numéro est tout en haut.
        tell: Un numéro trouvé en ligne peut être faux, lui aussi. Celui au dos de votre carte est sûr.
  - say:
      - Votre vraie banque répond. Aucune opération de 700 €. Votre épargne n'a pas bougé.
  - say:
      - La Banque qui a oublié votre nom compose le numéro suivant. « Cher client ? » Clic.
