id: gift-cards
order: 7
title: Le piège des cartes cadeaux
character: Monsieur Carte Cadeau
emoji: "🎁"
minutes: 1
badge: Incollable sur les cartes cadeaux
rule: Aucun organisme officiel ne se fait payer en cartes cadeaux ou en coupons. Qui vous en demande est un escroc.
steps:
  - say:
      - Lundi, 10 heures. Le café vient de passer, et le téléphone sonne.
  - from: character
    as: Centre des impôts
    say:
      - Ici le centre des impôts. Vous devez **480 €**. Payez avant midi, sinon l'huissier passe cet après-midi.
      - Aujourd'hui, nous ne prenons que les **cartes cadeaux**.
      - Grattez la bande argentée pour moi et lisez-moi les codes. Je n'ai jamais de pièce.
  - ask: Que faites-vous ?
    choices:
      - text: J'achète une seule carte, pour être tranquille.
        reply: Une carte ! Parfait. Puis une pour la majoration. Puis une pour la majoration de la majoration.
        tell: Les impôts ne se paient jamais en cartes cadeaux. Pas une carte, jamais.
      - text: Je demande à payer par virement.
        reply: Un virement ? Ça laisse des traces. Une carte cadeau, aucune. C'est pour ça que je les adore.
        tell: Seul un escroc exige des cartes cadeaux. Raccrochez.
      - text: Je raccroche et j'appelle le numéro de mon avis d'imposition.
        right: true
        reply: Le numéro de votre avis ? Ça sonne chez les VRAIS impôts. Ils n'ont jamais entendu parler de moi.
        tell: Votre avis d'imposition donne le vrai numéro. Aucun service public ne se fait payer en cartes cadeaux.
  - say:
      - Mercredi, un e-mail arrive au nom de votre ami Gérard.
  - from: character
    as: Gérard
    say:
      - Je suis à Madrid, on m'a volé mon portefeuille ! Tu peux m'acheter 4 cartes cadeaux de 200 € et m'envoyer les codes ?
      - Et surtout, n'en parle à personne.
  - ask: Et maintenant ?
    choices:
      - text: Je les envoie. Gérard ferait pareil pour moi.
        reply: Merci, merci ! Envoie juste une photo du dos des cartes. Ah, ces jolies bandes argentées…
        tell: Qui demande des cartes cadeaux est un escroc, même sous le nom d'un ami. Appelez Gérard au numéro que vous avez.
      - text: J'appelle Gérard au numéro que j'ai déjà.
        right: true
        reply: Vous avez appelé le VRAI Gérard ? Il est chez lui, en pantoufles, bien loin de Madrid.
        tell: Le numéro que vous avez déjà mène au vrai Gérard. Celui qui veut des cartes cadeaux est quelqu'un d'autre.
      - text: Je réponds à l'e-mail pour savoir s'il va bien.
        reply: Je vais bien, juste pressé ! Les cartes, s'il te plaît. Et une pièce, si tu en as une.
        tell: Une réponse part chez celui qui a écrit l'e-mail. Appelez Gérard au numéro que vous avez déjà.
  - say:
      - Vendredi, votre voisine Josiane sonne, téléphone sur haut-parleur. Elle part acheter des cartes cadeaux avant midi.
  - from: character
    as: Centre des impôts
    say:
      - Vite, Josiane ! Les cartes cadeaux avant midi, ou l'huissier passe ! Et apportez une pièce, je n'en ai jamais.
  - ask: Et vous ?
    choices:
      - text: "Je lui dis de raccrocher : aucun organisme officiel ne prend de cartes cadeaux."
        right: true
        reply: Vous le lui avez DIT ? Elle va le répéter à tout le quartier. Ma semaine est fichue.
        tell: Une phrase peut faire économiser 480 € à une voisine. Aucun organisme officiel ne prend de cartes cadeaux.
      - text: Je propose de l'emmener au bureau de tabac. Il est presque midi.
        reply: Comme c'est gentil ! Roulez vite. Je la garde au téléphone tout le trajet.
        tell: Les impôts ne prennent pas de cartes cadeaux. Le plus gentil, c'est de le dire à Josiane.
      - text: Je ne dis rien. Ça ne me regarde pas.
        reply: Parfait. Ses affaires sont mes affaires, maintenant.
        tell: "Parler, ce n'est pas se mêler de tout. Dites-lui : aucun organisme officiel ne prend de cartes cadeaux."
  - from: you
    say:
      - Josiane, appelez le numéro de votre avis d'imposition. Puis entrez prendre un café.
  - say:
      - Monsieur Carte Cadeau repart les poches vides. Pas une carte, pas un code, et toujours pas de pièce.
